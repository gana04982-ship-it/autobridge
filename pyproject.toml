[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autobridge"
version = "1.0.0"
authors = [
  { name="Ganesh", email="ganesh@autobridge.systems" },
]
description = "Zero-dependency ANSI X12 856 EDI pre-flight firewall & deterministic auto-repair engine for automotive Tier-1/Tier-2 supply chains."
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
autobridge = "autobridge.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["autobridge*"]
