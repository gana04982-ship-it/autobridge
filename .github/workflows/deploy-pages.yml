name: Deploy AutoBridge to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    name: Run Deterministic Engine Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Unit Tests
        run: |
          python -m unittest discover tests -v

  build-and-deploy:
    name: Build & Deploy Static Web Application
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Stage Static Web Distribution
        run: |
          mkdir -p dist
          # Copy root entrypoint and bypass Jekyll
          cp index.html dist/
          touch dist/.nojekyll
          [ -f CNAME ] && cp CNAME dist/ || true
          [ -f robots.txt ] && cp robots.txt dist/ || true
          [ -f llms.txt ] && cp llms.txt dist/ || true
          [ -f llms-full.txt ] && cp llms-full.txt dist/ || true
          [ -f sitemap.xml ] && cp sitemap.xml dist/ || true
          
          # Copy UI application suite
          cp -r ui dist/ui
          
          # Copy samples for direct inspection
          cp -r samples dist/samples

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
