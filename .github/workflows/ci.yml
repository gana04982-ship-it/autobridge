name: AutoBridge CI & EDI AST Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Unit & Industrial AST Suite (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Run AutoBridge Test Harness
      run: |
        python -m unittest discover tests -v

    - name: Run Real Sample EDI Audit & Auto-Repair Smoke Test
      run: |
        python autobridge/cli.py audit samples/ford_dock_rejection_trap.edi --oem FORD-AIAG-B10
        python autobridge/cli.py repair samples/ford_dock_rejection_trap.edi --out /tmp/clean.edi || python autobridge/cli.py repair samples/ford_dock_rejection_trap.edi --out clean_test.edi
